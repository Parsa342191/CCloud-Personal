name: Android CI Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # NOTE: packages is explicitly overridden to "platform-tools" only.
      # The action's default ("tools platform-tools") requests the legacy
      # "tools" SDK package, which Google has removed from the SDK
      # repository index. Requesting it now makes sdkmanager fail before
      # the build even starts. platform-tools is all this step needs;
      # Gradle/AGP will fetch the specific platform and build-tools
      # versions the project requires on its own.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
